/* ===== 器件框拖拽 ===== */
function enableDrag(el, comp, card) {
  var dragData = null;
  var DRAG_THRESHOLD = 4; /* 像素，超过才算拖拽，避免误触 */

  function onPointerDown(e) {
    /* 编辑模式下点击删除按钮不触发拖拽 */
    if (e.target.classList.contains("del-btn")) return;
    /* 调整大小手柄不触发拖拽 */
    if (e.target.classList.contains("resize-handle")) return;
    /* 连线模式下不拖拽 */
    if (connMode) return;

    e.preventDefault();
    var rect = card.getBoundingClientRect();
    var px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    } else {
      px = e.clientX; py = e.clientY;
    }
    dragData = {
      startX: px, startY: py,
      origX: comp.x, origY: comp.y,
      cardW: card.clientWidth, cardH: card.clientHeight,
      moved: false
    };
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("touchmove", onPointerMove, {passive:false});
    document.addEventListener("touchend", onPointerUp);
  }

  function onPointerMove(e) {
    if (!dragData) return;
    e.preventDefault();
    var px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    } else {
      px = e.clientX; py = e.clientY;
    }
    var dxPx = px - dragData.startX;
    var dyPx = py - dragData.startY;

    if (!dragData.moved && Math.abs(dxPx) < DRAG_THRESHOLD && Math.abs(dyPx) < DRAG_THRESHOLD) return;

    if (!dragData.moved) {
      dragData.moved = true;
      el.classList.add("dragging");
    }

    var dxPct = dxPx / dragData.cardW * 100;
    var dyPct = dyPx / dragData.cardH * 100;
    var newX = dragData.origX + dxPct;
    var newY = dragData.origY + dyPct;
    /* 限制在画布范围内 */
    newX = Math.max(0, Math.min(100 - comp.w, newX));
    newY = Math.max(0, Math.min(100 - comp.h, newY));
    comp.x = newX;
    comp.y = newY;
    el.style.left = (newX * dragData.cardW / 100) + "px";
    el.style.top = (newY * dragData.cardH / 100) + "px";
    /* 实时刷新连线 */
    renderConns();
  }

  function onPointerUp(e) {
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    document.removeEventListener("touchmove", onPointerMove);
    document.removeEventListener("touchend", onPointerUp);
    if (dragData && dragData.moved) {
      el.classList.remove("dragging");
      /* 拖拽过则不触发点击 */
      var wasMoved = true;
      el._dragged = wasMoved;
      setTimeout(function(){ el._dragged = false; }, 50);
      autoSave();
    }
    dragData = null;
  }

  /* 拦截点击：如果刚拖拽过，阻止 click 事件 */
  el.addEventListener("click", function(e) {
    if (el._dragged) {
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  el.addEventListener("pointerdown", onPointerDown);
  el.addEventListener("touchstart", onPointerDown, {passive:false});
}

/* ===== 器件框调整大小 ===== */
function enableResize(el, comp, card) {
  var handle = el.querySelector(".resize-handle");
  if (!handle) return;
  var resizeData = null;
  var MIN_W = 5, MIN_H = 5; /* 最小宽高百分比 */

  function onResizeDown(e) {
    e.stopPropagation();
    e.preventDefault();
    var px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    } else {
      px = e.clientX; py = e.clientY;
    }
    resizeData = {
      startX: px, startY: py,
      origW: comp.w, origH: comp.h,
      origX: comp.x, origY: comp.y,
      cardW: card.clientWidth, cardH: card.clientHeight,
      moved: false
    };
    el.classList.add("resizing");
    document.addEventListener("pointermove", onResizeMove);
    document.addEventListener("pointerup", onResizeUp);
    document.addEventListener("touchmove", onResizeMove, {passive:false});
    document.addEventListener("touchend", onResizeUp);
  }

  function onResizeMove(e) {
    if (!resizeData) return;
    e.preventDefault();
    var px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    } else {
      px = e.clientX; py = e.clientY;
    }
    var dxPx = px - resizeData.startX;
    var dyPx = py - resizeData.startY;
    var dxPct = dxPx / resizeData.cardW * 100;
    var dyPct = dyPx / resizeData.cardH * 100;

    resizeData.moved = true;

    var newW = resizeData.origW + dxPct;
    var newH = resizeData.origH + dyPct;
    /* 限制最小大小 */
    newW = Math.max(MIN_W, newW);
    newH = Math.max(MIN_H, newH);
    /* 限制不超出画布右下边界 */
    newW = Math.min(newW, 100 - comp.x);
    newH = Math.min(newH, 100 - comp.y);

    comp.w = newW;
    comp.h = newH;
    el.style.width = (newW * resizeData.cardW / 100) + "px";
    el.style.height = (newH * resizeData.cardH / 100) + "px";
    /* 实时刷新连线 */
    renderConns();
  }

  function onResizeUp(e) {
    document.removeEventListener("pointermove", onResizeMove);
    document.removeEventListener("pointerup", onResizeUp);
    document.removeEventListener("touchmove", onResizeMove);
    document.removeEventListener("touchend", onResizeUp);
    el.classList.remove("resizing");
    if (resizeData && resizeData.moved) {
      el._dragged = true;
      setTimeout(function(){ el._dragged = false; }, 50);
      autoSave();
    }
    resizeData = null;
  }

  handle.addEventListener("pointerdown", onResizeDown);
  handle.addEventListener("touchstart", onResizeDown, {passive:false});
}

/* ===== 连线路由：绕过器件框、不重叠、美观 ===== */

function expandRect(r, pad) {
  return {x: r.x - pad, y: r.y - pad, w: r.w + 2*pad, h: r.h + 2*pad};
}

function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function segIntersectsRect(x1, y1, x2, y2, r) {
  if (pointInRect(x1, y1, r) || pointInRect(x2, y2, r)) return true;
  if (x1 === x2) {
    var minY = Math.min(y1,y2), maxY = Math.max(y1,y2);
    return x1 >= r.x && x1 <= r.x + r.w && maxY >= r.y && minY <= r.y + r.h;
  }
  if (y1 === y2) {
    var minX = Math.min(x1,x2), maxX = Math.max(x1,x2);
    return y1 >= r.y && y1 <= r.y + r.h && maxX >= r.x && minX <= r.x + r.w;
  }
  return false;
}

function pathIntersectsRects(path, rects) {
  for (var i = 0; i < path.length - 1; i++) {
    for (var j = 0; j < rects.length; j++) {
      if (segIntersectsRect(path[i].x, path[i].y, path[i+1].x, path[i+1].y, rects[j])) return true;
    }
  }
  return false;
}

function getCompRect(c, w, h) {
  return {x: c.x * w / 100, y: c.y * h / 100, w: c.w * w / 100, h: c.h * h / 100};
}

function getEdgePoint(c, w, h, tx, ty) {
  var rect = getCompRect(c, w, h);
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return {x: cx, y: cy};
  var scale;
  if (Math.abs(dx) / Math.max(rect.w, 1) > Math.abs(dy) / Math.max(rect.h, 1)) {
    scale = (rect.w / 2) / Math.abs(dx);
  } else {
    scale = (rect.h / 2) / Math.abs(dy);
  }
  return {x: cx + dx * scale, y: cy + dy * scale};
}

/* L 形折线：先水平后垂直 / 先垂直后水平 */
function tryLRoute(s, d, rects, firstHorizontal) {
  var mid;
  if (firstHorizontal) {
    mid = {x: d.x, y: s.y};
  } else {
    mid = {x: s.x, y: d.y};
  }
  var path = [s, mid, d];
  if (!pathIntersectsRects(path, rects)) return path;
  return null;
}

/* Z 形折线：两段水平 + 中间垂直 / 两段垂直 + 中间水平 */
function tryZRoute(s, d, rects, horizontal) {
  var candidates = [];
  if (horizontal) {
    var midX = (s.x + d.x) / 2;
    candidates = [
      [{x:s.x,y:s.y},{x:midX,y:s.y},{x:midX,y:d.y},{x:d.x,y:d.y}],
      [{x:s.x,y:s.y},{x:s.x+(d.x-s.x)*0.3,y:s.y},{x:s.x+(d.x-s.x)*0.3,y:d.y},{x:d.x,y:d.y}],
      [{x:s.x,y:s.y},{x:s.x+(d.x-s.x)*0.7,y:s.y},{x:s.x+(d.x-s.x)*0.7,y:d.y},{x:d.x,y:d.y}],
    ];
  } else {
    var midY = (s.y + d.y) / 2;
    candidates = [
      [{x:s.x,y:s.y},{x:s.x,y:midY},{x:d.x,y:midY},{x:d.x,y:d.y}],
      [{x:s.x,y:s.y},{x:s.x,y:s.y+(d.y-s.y)*0.3},{x:d.x,y:s.y+(d.y-s.y)*0.3},{x:d.x,y:d.y}],
      [{x:s.x,y:s.y},{x:s.x,y:s.y+(d.y-s.y)*0.7},{x:d.x,y:s.y+(d.y-s.y)*0.7},{x:d.x,y:d.y}],
    ];
  }
  for (var i = 0; i < candidates.length; i++) {
    if (!pathIntersectsRects(candidates[i], rects)) return candidates[i];
  }
  return null;
}

/* 外部绕行：走画布边缘 */
function tryEdgeRoute(s, d, rects, w, h) {
  var margin = 6;
  var routes = [
    [{x:s.x,y:s.y},{x:s.x,y:margin},{x:d.x,y:margin},{x:d.x,y:d.y}],
    [{x:s.x,y:s.y},{x:s.x,y:h-margin},{x:d.x,y:h-margin},{x:d.x,y:d.y}],
    [{x:s.x,y:s.y},{x:margin,y:s.y},{x:margin,y:d.y},{x:d.x,y:d.y}],
    [{x:s.x,y:s.y},{x:w-margin,y:s.y},{x:w-margin,y:d.y},{x:d.x,y:d.y}],
    [{x:s.x,y:s.y},{x:s.x,y:margin},{x:w-margin,y:margin},{x:w-margin,y:d.y},{x:d.x,y:d.y}],
    [{x:s.x,y:s.y},{x:s.x,y:h-margin},{x:margin,y:h-margin},{x:margin,y:d.y},{x:d.x,y:d.y}],
  ];
  for (var i = 0; i < routes.length; i++) {
    if (!pathIntersectsRects(routes[i], rects)) return routes[i];
  }
  return null;
}

function routePath(s, d, rects, w, h) {
  if (rects.length === 0) return [s, d];
  var path;
  path = tryLRoute(s, d, rects, true);
  if (path) return path;
  path = tryLRoute(s, d, rects, false);
  if (path) return path;
  path = tryZRoute(s, d, rects, true);
  if (path) return path;
  path = tryZRoute(s, d, rects, false);
  if (path) return path;
  path = tryEdgeRoute(s, d, rects, w, h);
  if (path) return path;
  return [s, d];
}

function pathToD(path) {
  if (path.length < 2) return "";
  var d = "M " + path[0].x.toFixed(1) + " " + path[0].y.toFixed(1);
  for (var i = 1; i < path.length; i++) {
    d += " L " + path[i].x.toFixed(1) + " " + path[i].y.toFixed(1);
  }
  return d;
}

function renderConns() {
  var svg = document.getElementById("connLayer");
  svg.innerHTML = "";
  var card = document.getElementById("pcieCard");
  var w = card.clientWidth, h = card.clientHeight;
  var pad = 4;

  /* 构建障碍矩形列表（所有器件框，膨胀 pad 像素） */
  var obsRects = components.map(function(c) {
    return expandRect(getCompRect(c, w, h), pad);
  });

  connections.forEach(function(conn, idx) {
    var c1 = components.find(function(c){return c.id === conn.from;});
    var c2 = components.find(function(c){return c.id === conn.to;});
    if (!c1 || !c2) return;

    var center1 = {x: (c1.x + c1.w/2) * w / 100, y: (c1.y + c1.h/2) * h / 100};
    var center2 = {x: (c2.x + c2.w/2) * w / 100, y: (c2.y + c2.h/2) * h / 100};

    /* 起点/终点从器件边缘出发 */
    var s = getEdgePoint(c1, w, h, center2.x, center2.y);
    var d = getEdgePoint(c2, w, h, center1.x, center1.y);

    /* 排除起点和终点自身器件框（连线可以贴着自己的边缘） */
    var obs = obsRects.filter(function(r, i) {
      return components[i].id !== c1.id && components[i].id !== c2.id;
    });

    var path = routePath(s, d, obs, w, h);

    /* 绘制路径 */
    var pEl = document.createElementNS("http://www.w3.org/2000/svg","path");
    pEl.setAttribute("d", pathToD(path));
    pEl.setAttribute("class","conn-line");
    /* 透明加粗路径用于点击 */
    pEl.style.pointerEvents = "stroke";
    pEl.onclick = function(e){ e.stopPropagation(); delConn(idx); };
    svg.appendChild(pEl);

    /* 中点圆点 */
    var midIdx = Math.floor(path.length / 2);
    var mid = path[midIdx];
    var circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx", mid.x);
    circle.setAttribute("cy", mid.y);
    circle.setAttribute("r", 5);
    circle.setAttribute("class","conn-dot");
    circle.onclick = function(e){ e.stopPropagation(); delConn(idx); };
    svg.appendChild(circle);
  });
}

function delConn(idx) {
  if (!confirm("删除这条连线？")) return;
  connections.splice(idx, 1);
  renderConns();
  autoSave();
}

function setMode(m) {
  currentMode = m;
  document.getElementById("btnView").classList.toggle("active", m === "view");
  document.getElementById("btnEdit").classList.toggle("active", m === "edit");
  document.querySelectorAll(".component").forEach(function(el){
    el.classList.toggle("edit-mode", m === "edit");
  });
  document.getElementById("hintBar").textContent = m === "edit"
    ? "编辑模式：点击器件红色×删除 | 顶部按钮添加器件/连线"
    : "查看模式：点击器件框查看详情";
}

function startAddConn() {
  connMode = true; connStep = 0; connFrom = null;
  document.getElementById("btnConn").classList.add("active");
  document.getElementById("hintBar").textContent = "连线模式：点击第一个器件";
}

function delComp(id) {
  if (!confirm("删除此器件？")) return;
  components = components.filter(function(c){return c.id !== id;});
  connections = connections.filter(function(c){return c.from !== id && c.to !== id;});
  renderCard();
  renderSummary();
  autoSave();
}

    '<label>X% (0-90)</label><input type="number" id="nf-x" value="40" min="0" max="90">' +

  components.push({
    id: id,
    name: document.getElementById("nf-name").value || "新器件",
    model: document.getElementById("nf-model").value || "—",

function exportData() {
  var data = JSON.stringify({components: components, connections: connections}, null, 2);
  var blob = new Blob([data], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "器件选型追踪.json";
  a.click();
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.components) components = data.components;
      if (data.connections) connections = data.connections;
      autoSave();
      renderCard();
      renderSummary();
    } catch(err) { alert("导入失败: " + err.message); }
  };
  reader.readAsText(file);
}

function openModal(c) {
  var titleEl = document.getElementById("modalTitle");
  titleEl.innerHTML = '<input class="modal-title-input" id="editTitle" value="' + c.name + ' — ' + c.model + '">';
  var body = document.getElementById("modalBody");
  var html = "";

  /* 参数列表区 */
  html += '<div class="section-title-edit"><span>器件参数</span><button class="btn-add-sm" onclick="addParamRow()">+ 新增参数</button></div>';
  html += '<div id="paramList" class="info-grid-edit">';

  /* 遍历组件对象的所有非 functions 字段 */
  var paramFields = [
    {key:"name", label:"名称"},
    {key:"model", label:"型号"},
    {key:"vendor", label:"厂商"},
    {key:"package", label:"封装"},
    {key:"power", label:"功耗"},
    {key:"price", label:"单价"},
    {key:"availability", label:"可获得性", type:"select", options:availLabels},
    {key:"alt", label:"替代料"},
    {key:"note", label:"备注"}
  ];
  paramFields.forEach(function(p) {
    var val = c[p.key] || "";
    if (p.type === "select") {
      html += '<div class="param-row param-row-avail"><input class="param-label" value="' + p.label + '" data-param-key="' + p.key + '" data-param-type="select" data-param-label="' + p.label + '" readonly>';
      html += '<select class="param-value param-value-avail" data-param-key="' + p.key + '" data-param-type="select" onchange="previewAvailColor(this)">';
      Object.keys(p.options).forEach(function(k) {
        html += '<option value="' + k + '"' + (c[p.key] === k ? ' selected' : '') + '>' + p.options[k] + '</option>';
      });
      html += '</select>';
      html += '<div class="avail-color-preview" style="background:' + (ctxColorMap[c[p.key]] || '#ccc') + ';border:1px solid ' + (availBorderMap[c[p.key]] || '#ccc') + '"></div>';
      html += '</div>';
    } else {
      html += '<div class="param-row"><input class="param-label" value="' + p.label + '" data-param-key="' + p.key + '" data-param-label="' + p.label + '" readonly>';
      html += '<input class="param-value" data-param-key="' + p.key + '" value="' + escapeAttr(val) + '"></div>';
    }
  });

  /* 额外的自定义参数 */
  if (c.customParams) {
    c.customParams.forEach(function(p) {
      html += '<div class="param-row"><input class="param-label" value="' + escapeAttr(p.label) + '" data-param-custom="1" data-param-label="' + escapeAttr(p.label) + '">';
      html += '<input class="param-value" data-param-custom="1" data-param-label="' + escapeAttr(p.label) + '" value="' + escapeAttr(p.value) + '"></div>';
    });
  }

  html += '</div>';

  /* 功能列表区 */
  html += '<div class="section-title-edit"><span>支撑功能与固件状态 (' + c.functions.length + '项)</span><button class="btn-add-sm" onclick="addFuncRow()">+ 新增功能</button></div>';
  html += '<div id="funcList">';
  c.functions.forEach(function(f, idx) {
    html += renderFuncRow(f, idx);
  });
  html += '</div>';

  /* 保存按钮 */
  html += '<div class="modal-save-bar"><button class="btn-save" onclick="saveCompEdit(\'' + c.id + '\')">保存修改</button></div>';

  body.innerHTML = html;
  document.getElementById("modalOverlay").classList.add("active");
}

function renderFuncRow(f, idx) {
  var html = '<div class="func-row" data-func-idx="' + idx + '">';
  html += '<div class="func-row-head">';
  html += '<input class="fn-name" data-fn-field="name" value="' + escapeAttr(f.name || "") + '" placeholder="功能名称">';
  html += '<select class="fn-status" data-fn-field="status">';
  Object.keys(statusLabels).forEach(function(k) {
    html += '<option value="' + k + '"' + (f.status === k ? ' selected' : '') + '>' + statusLabels[k] + '</option>';
  });
  html += '</select>';
  html += '<div class="btn-del-sm" onclick="delFuncRow(this)">×</div>';
  html += '</div>';
  html += '<div class="func-row-body">';
  html += '<div class="fn-field"><label>描述</label><input data-fn-field="desc" value="' + escapeAttr(f.desc || "") + '"></div>';
  html += '<div class="fn-field"><label>固件</label><input data-fn-field="fw" value="' + escapeAttr(f.fw || "") + '"></div>';
  html += '<div class="fn-field"><label>语言</label><input data-fn-field="lang" value="' + escapeAttr(f.lang || "") + '"></div>';
  html += '<div class="fn-field"><label>负责人</label><input data-fn-field="owner" value="' + escapeAttr(f.owner || "") + '"></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function escapeAttr(s) {
  if (s == null) return "";
  return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addParamRow() {
  var list = document.getElementById("paramList");
  var div = document.createElement("div");
  div.className = "param-row";
  div.innerHTML = '<input class="param-label" value="新参数" data-param-custom="1" data-param-label="新参数">' +
    '<input class="param-value" data-param-custom="1" data-param-label="新参数" value="">' +
    '<div class="btn-del-sm" onclick="this.parentElement.remove()">×</div>';
  list.appendChild(div);
}

function addFuncRow() {
  var list = document.getElementById("funcList");
  var idx = list.children.length;
  var div = document.createElement("div");
  div.innerHTML = renderFuncRow({name:"新功能",desc:"",fw:"",lang:"",owner:"",status:"todo"}, idx);
  list.appendChild(div.firstChild);
}

function delFuncRow(btn) {
  btn.closest(".func-row").remove();
}

function saveCompEdit(id) {
  var c = components.find(function(x){return x.id === id;});
  if (!c) return;

  /* 收集固定参数 */
  var fixedKeys = ["name","model","vendor","package","power","price","availability","alt","note"];
  fixedKeys.forEach(function(key) {
    var el = document.querySelector('.param-value[data-param-key="' + key + '"]');
    if (el) c[key] = el.value;
  });

  /* 收集自定义参数 */
  var customParams = [];
  document.querySelectorAll('[data-param-custom="1"]').forEach(function(el) {
    var label = el.getAttribute("data-param-label");
    if (el.classList.contains("param-label")) {
      var next = el.nextElementSibling;
      if (next && next.classList.contains("param-value")) {
        customParams.push({label: el.value, value: next.value});
      }
    }
  });
  c.customParams = customParams;

  /* 收集功能列表 */
  var funcs = [];
  document.querySelectorAll("#funcList .func-row").forEach(function(row) {
    var fn = {};
    row.querySelectorAll("[data-fn-field]").forEach(function(field) {
      fn[field.getAttribute("data-fn-field")] = field.value;
    });
    if (fn.name) funcs.push(fn);
  });
  c.functions = funcs;

  /* 刷新画布和标题 */
  renderCard();
  renderSummary();
  autoSave();
  closeModal();
  document.getElementById("hintBar").textContent = c.name + " 已保存";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
}

document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModal();
});

/* ===== 自动优化布局：力导向算法 ===== */
function autoLayout() {
  if (components.length === 0) return;

  var card = document.getElementById("pcieCard");
  var cardW = card.clientWidth;
  var cardH = card.clientHeight;

  /* 构建邻接表 */
  var adj = {};
  components.forEach(function(c) { adj[c.id] = []; });
  connections.forEach(function(conn) {
    if (adj[conn.from]) adj[conn.from].push(conn.to);
    if (adj[conn.to]) adj[conn.to].push(conn.from);
  });

  /* 连线数映射 */
  var degree = {};
  components.forEach(function(c) { degree[c.id] = adj[c.id].length; });

  /* 初始化位置（用当前坐标，转为 0-1 归一化） */
  var pos = {};
  components.forEach(function(c) {
    pos[c.id] = {
      x: (c.x + c.w/2) / 100,
      y: (c.y + c.h/2) / 100
    };
  });

  /* 力导向参数 */
  var ITERATIONS = 300;
  var K_REPULSE = 0.0008;   /* 排斥力系数 */
  var K_ATTRACT = 0.02;     /* 吸引力系数 */
  var K_DAMPING = 0.85;     /* 阻尼 */
  var MIN_DIST = 0.01;      /* 最小距离防除零 */
  var EDGE_MARGIN = 0.02;   /* 边界边距 */

  /* 速度 */
  var vel = {};
  components.forEach(function(c) { vel[c.id] = {x:0, y:0}; });

  for (var iter = 0; iter < ITERATIONS; iter++) {
    var force = {};
    components.forEach(function(c) { force[c.id] = {x:0, y:0}; });

    /* 排斥力：所有器件两两之间 */
    for (var i = 0; i < components.length; i++) {
      for (var j = i+1; j < components.length; j++) {
        var a = components[i].id, b = components[j].id;
        var dx = pos[a].x - pos[b].x;
        var dy = pos[a].y - pos[b].y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        dist = Math.max(MIN_DIST, dist);
        /* 排斥力与距离反比 */
        var rep = K_REPULSE / (dist * dist);
        var fx = (dx / dist) * rep;
        var fy = (dy / dist) * rep;
        force[a].x += fx; force[a].y += fy;
        force[b].x -= fx; force[b].y -= fy;
      }
    }

    /* 吸引力：有连线的器件之间 */
    connections.forEach(function(conn) {
      var a = conn.from, b = conn.to;
      if (!pos[a] || !pos[b]) return;
      var dx = pos[b].x - pos[a].x;
      var dy = pos[b].y - pos[a].y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      dist = Math.max(MIN_DIST, dist);
      /* 吸引力与距离成正比（弹簧模型） */
      var attract = K_ATTRACT * dist;
      var fx = (dx / dist) * attract;
      var fy = (dy / dist) * attract;
      force[a].x += fx; force[a].y += fy;
      force[b].x -= fx; force[b].y -= fy;
    });

    /* 中心引力：防止器件飞散 */
    var centerX = 0.5, centerY = 0.5;
    components.forEach(function(c) {
      var dx = centerX - pos[c.id].x;
      var dy = centerY - pos[c.id].y;
      force[c.id].x += dx * 0.001;
      force[c.id].y += dy * 0.001;
    });

    /* 更新位置 */
    components.forEach(function(c) {
      vel[c.id].x = (vel[c.id].x + force[c.id].x) * K_DAMPING;
      vel[c.id].y = (vel[c.id].y + force[c.id].y) * K_DAMPING;
      pos[c.id].x += vel[c.id].x;
      pos[c.id].y += vel[c.id].y;
      /* 边界约束 */
      pos[c.id].x = Math.max(EDGE_MARGIN + c.w/200, Math.min(1 - EDGE_MARGIN - c.w/200, pos[c.id].x));
      pos[c.id].y = Math.max(EDGE_MARGIN + c.h/200, Math.min(1 - EDGE_MARGIN - c.h/200, pos[c.id].y));
    });
  }

  /* 带动画地应用新位置 */
  var animSteps = 30;
  var startPos = {};
  var endPos = {};
  components.forEach(function(c) {
    startPos[c.id] = {x: c.x, y: c.y};
    endPos[c.id] = {
      x: pos[c.id].x * 100 - c.w/2,
      y: pos[c.id].y * 100 - c.h/2
    };
    /* 边界保护 */
    endPos[c.id].x = Math.max(0, Math.min(100 - c.w, endPos[c.id].x));
    endPos[c.id].y = Math.max(0, Math.min(100 - c.h, endPos[c.id].y));
  });

  var step = 0;
  function animateLayout() {
    step++;
    var t = step / animSteps;
    var ease = 1 - Math.pow(1 - t, 3); /* ease-out cubic */
    components.forEach(function(c) {
      c.x = startPos[c.id].x + (endPos[c.id].x - startPos[c.id].x) * ease;
      c.y = startPos[c.id].y + (endPos[c.id].y - startPos[c.id].y) * ease;
    });
    renderCard();
    if (step < animSteps) {
      requestAnimationFrame(animateLayout);
    } else {
      autoSave();
      document.getElementById("hintBar").textContent = "布局已优化：连线多的器件靠近，无连线器件分散";
    }
  }
  animateLayout();
}

function renderSummary() {
  var total = components.length;
  var avail = components.filter(function(c){return c.availability === "available";}).length;
  var limited = components.filter(function(c){return c.availability === "limited";}).length;
  var allFuncs = [];
  components.forEach(function(c){ allFuncs = allFuncs.concat(c.functions); });
  var ready = allFuncs.filter(function(f){return f.status === "ready";}).length;
  var dev = allFuncs.filter(function(f){return f.status === "dev";}).length;
  var todo = allFuncs.filter(function(f){return f.status === "todo";}).length;
  var totalFuncs = allFuncs.length;
  var bar = document.getElementById("summaryBar");
  bar.innerHTML = "";
  bar.appendChild(makeSummaryCard(total, "器件总数"));
  bar.appendChild(makeSummaryCard(avail, "可采购"));
  bar.appendChild(makeSummaryCard(limited, "交期受限"));
  bar.appendChild(makeSummaryCard(totalFuncs, "功能总数"));
  bar.appendChild(makeSummaryCard(ready, "已就绪"));
  bar.appendChild(makeSummaryCard(dev, "开发中"));
  bar.appendChild(makeSummaryCard(todo, "未开始"));
}

function makeSummaryCard(num, label) {
  var div = document.createElement("div");
  div.className = "summary-card";
  div.innerHTML = '<div class="summary-num">' + num + '</div><div class="summary-label">' + label + "</div>";
  return div;
}

/* 图例标签修改：同步更新 availLabels 并刷新界面 */
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll(".legend-label").forEach(function(input) {
    input.addEventListener("change", function() {
      var key = this.getAttribute("data-avail-key");
      var newLabel = this.value.trim() || availLabels[key];
      this.value = newLabel;
      availLabels[key] = newLabel;
      /* 刷新画布上的器件框（class 不变，只是标签变化） */
      /* 刷新统计栏和弹窗中引用 availLabels 的部分 */
      renderSummary();
      autoSave();
    });
  });
});

window.addEventListener("load", function() {
  /* 尝试从 localStorage 恢复 */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("sca-board-data") || "null"); } catch(e) {}
  if (saved) {
    if (saved.components) {
      /* 保留原始默认 components 的引用，替换内容 */
      components.length = 0;
      saved.components.forEach(function(c){ components.push(c); });
    }
    if (saved.connections) connections = saved.connections;
    if (saved.availLabels) {
      Object.keys(saved.availLabels).forEach(function(k){
        if (availLabels[k] !== undefined) availLabels[k] = saved.availLabels[k];
      });
      /* 同步图例输入框 */
      document.querySelectorAll(".legend-label").forEach(function(input) {
        var key = input.getAttribute("data-avail-key");
        if (saved.availLabels[key]) input.value = saved.availLabels[key];
      });
    }
  } else {
    /* 首次加载，初始化默认连线 */
    if (connections.length === 0) {
      connections = [
        {from:"host-sw",to:"ctrl-fpga"},
        {from:"ctrl-fpga",to:"main-fpga"},
        {from:"main-fpga",to:"adc"},
        {from:"adc",to:"lna"},
        {from:"lna",to:"shunt"},
        {from:"ctrl-fpga",to:"pll"},
        {from:"pll",to:"main-fpga"},
        {from:"ctrl-fpga",to:"usb"},
        {from:"main-fpga",to:"sma"},
        {from:"power",to:"main-fpga"}
      ];
    }
  }
  renderCard();
  renderSummary();
});

/* ===== localStorage 自动持久化 ===== */
var SAVE_KEY = "sca-board-data";
var saveTimer = null;
function autoSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    try {
      var data = {
        components: components,
        connections: connections,
        availLabels: availLabels
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch(e) { /* localStorage 满或禁用，静默 */ }
  }, 300);
}

function resetData() {
  if (!confirm("恢复到默认数据？当前所有修改将丢失。")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

window.addEventListener("resize", function() {
  renderCard();
});
